name: Accessibility Review

# Runs on every push to a branch with an open PR (DESIGN.md §5.1).
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.tsx'
      - '**/*.jsx'
      - '**/tokens/**'
      - 'a11y-agent.config.json'
      - 'a11y-exceptions.json'

permissions:
  contents: read
  pull-requests: write

concurrency:
  # A new push supersedes the in-flight review for the same PR.
  group: a11y-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the merge base resolves and the diff covers the
          # whole PR rather than the last push.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Verdict cache, keyed by file content (DESIGN.md §8.3). A push touching
      # one file re-judges one file and reuses the rest.
      - name: Restore verdict cache
        uses: actions/cache@v4
        with:
          path: .a11y-cache
          key: a11y-verdicts-${{ github.event.pull_request.number }}-${{ github.sha }}
          restore-keys: |
            a11y-verdicts-${{ github.event.pull_request.number }}-
            a11y-verdicts-

      # The skill itself is committed in-repo at .claude/skills/a11y-review —
      # no install/copy step needed, Claude Code discovers it automatically.
      - name: Install Claude Code CLI
        run: |
          # Installed from npm, which setup-node already puts on PATH.
          # The previously-used curl|bash installer URL returns 404, and
          # because curl's failure is hidden by the pipe the step exited 0
          # while installing nothing — hence "claude: command not found".
          npm install -g @anthropic-ai/claude-code

          # Fail loudly here rather than three attempts later.
          if ! command -v claude >/dev/null 2>&1; then
            echo "::error::claude not on PATH after npm install"
            npm bin -g || true
            exit 1
          fi
          claude --version

      - name: Run accessibility review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          # Two retries, then fail open with a visible notice (DESIGN.md §8.4).
          for attempt in 1 2 3; do
            echo "=== Attempt $attempt ==="
            # Agent is required: the skill's core step spawns one subagent
            # per file, and without it that step cannot execute.
            # stderr is tee'd so the real error appears in the CI log —
            # redirecting it to a file only made failures invisible.
            set +e
            claude -p "/a11y-review --base $BASE_BRANCH --ci" \
              --allowedTools "Read,Bash,Agent" \
              --permission-mode dontAsk \
              --debug \
              --output-format text \
              > report.md 2> >(tee review-error.log >&2)
            rc=$?
            set -e

            if [ "$rc" -eq 0 ]; then
              echo "status=ok" >> "$GITHUB_OUTPUT"
              echo "=== report.md ==="
              cat report.md
              exit 0
            fi

            echo "--- attempt $attempt failed, exit=$rc ---" >&2
            echo "--- stdout captured in report.md ---" >&2
            cat report.md >&2 || true
            sleep $((attempt * 10))
          done

          echo "status=failed-open" >> "$GITHUB_OUTPUT"

          # Recognise the failure modes that have a specific, actionable
          # cause, so the comment says what to do rather than dumping a log.
          cause="The review could not complete after 3 attempts."
          hint=""
          if grep -qiE 'credit balance|insufficient.*credit|quota.*exceed|billing' review-error.log 2>/dev/null; then
            cause="**The Anthropic API credit balance is exhausted.**"
            hint="Top up credits in the [Anthropic Console](https://console.anthropic.com/settings/billing), then re-run this workflow."
          elif grep -qiE 'rate.?limit|429' review-error.log 2>/dev/null; then
            cause="**The Anthropic API rate limit was hit.**"
            hint="Wait for the limit to reset and re-run this workflow."
          elif grep -qiE 'authentication|invalid.*api.?key|401|403' review-error.log 2>/dev/null; then
            cause="**Authentication failed.**"
            hint="Check that the \`ANTHROPIC_API_KEY\` repository secret is set and valid."
          fi

          {
            echo "## ❌ Accessibility review did not run"
            echo
            echo "$cause"
            echo
            echo "> ⚠️ **This PR has NOT been checked for accessibility.**"
            echo "> The check is not blocking — an infrastructure failure is not an"
            echo "> accessibility violation — but nothing here has been verified."
            echo "> Do not read the green check as a pass."
            echo
            if [ -n "$hint" ]; then echo "$hint"; echo; fi
            echo "<details><summary>Error output</summary>"
            echo
            echo '```'
            grep -viE '^\[DEBUG\]|^\s*$' review-error.log 2>/dev/null | tail -30 || tail -30 review-error.log || true
            echo '```'
            echo
            echo "</details>"
          } > report.md

      - name: Post or update PR comment
        # Always post — a comment explaining what happened beats a silent
        # red X when an earlier step fails for a reason not handled above.
        if: always()
        env:
          REVIEW_STATUS: ${{ steps.review.outputs.status }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Two separate comments, deliberately. A failed run must never
            // overwrite a successful review: losing a good report because a
            // later run ran out of credits is worse than an extra comment.
            const REPORT_MARKER  = '<!-- a11y-review-agent -->';
            const FAILURE_MARKER = '<!-- a11y-review-agent:failure -->';

            let body, failed;
            try {
              body = fs.readFileSync('report.md', 'utf8');
              failed = process.env.REVIEW_STATUS !== 'ok';
            } catch {
              body = '## ❌ Accessibility review did not run\n\n' +
                'This PR has **not** been checked for accessibility — ' +
                'the CI job failed before a report could be generated. ' +
                'Check the workflow run logs for the actual error.';
              failed = true;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number }
            );
            const find = (m) => comments.find(c => c.body.includes(m));

            const upsert = async (marker, text) => {
              const existing = find(marker);
              const payload = `${marker}\n${text}`;
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id, body: payload,
                });
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number, body: payload,
                });
              }
            };

            if (failed) {
              // Post the failure alongside the last good report, which stays
              // untouched and readable.
              await upsert(FAILURE_MARKER, body);
              const lastReport = find(REPORT_MARKER);
              if (lastReport) {
                core.notice('Review failed; the previous successful report is preserved above it.');
              }
            } else {
              // Success: refresh the report in place (one report per PR,
              // not a wall of stale ones — DESIGN.md §8.1) and clear any
              // stale failure notice so it cannot be mistaken for current.
              await upsert(REPORT_MARKER, body);
              const staleFailure = find(FAILURE_MARKER);
              if (staleFailure) {
                await github.rest.issues.deleteComment({
                  owner, repo, comment_id: staleFailure.id,
                });
              }
            }

      - name: Set check status
        if: always()
        run: |
          if [ ! -f report.md ] || [ "${{ steps.review.outputs.status }}" = "failed-open" ]; then
            # Loud but non-blocking: ::error:: surfaces a red annotation on
            # the run and in the PR's checks view, while exit 0 keeps the
            # merge unblocked — an outage is not an accessibility violation
            # (DESIGN.md §8.4). A silent green pass here would be worse:
            # it reads as "reviewed and clean" when nothing was reviewed.
            echo "::error::Accessibility review DID NOT RUN — this PR has not been checked. See the PR comment for the cause."
            {
              echo "## ❌ Accessibility review did not run"
              echo
              echo "This PR has **not** been checked for accessibility."
              echo "The check is non-blocking by design, so the merge is not held —"
              echo "but do not read it as a pass. See the PR comment for the cause."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Blocks only on critical findings introduced by this PR.
          # Pre-existing debt is reported but never blocks (DESIGN.md §8.2).
          if grep -q '^❌ BLOCKING' report.md; then
            echo "::error::Critical accessibility issues introduced by this PR."
            exit 1
          fi
          echo "No critical issues introduced."
